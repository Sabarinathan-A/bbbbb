[metadata]
name = attackpath
version = 0.1.0
description = AttackPath Engine: reconstructs attack paths from JSON scenario data, computes root cause and blast radius, and evaluates remediations.
long_description = file: README.md
long_description_content_type = text/markdown

[options]
packages = find:
python_requires = >=3.9
install_requires =
    networkx>=3.2

[options.packages.find]
include =
    attackpath*

[options.extras_require]
test =
    pytest>=7.4
